name: Update GitHub hot projects

on:
  schedule:
    # 00:10 Asia/Shanghai = 16:10 UTC
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional report date in Asia/Shanghai (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-hot
  cancel-in-progress: false

jobs:
  update-github-hot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate GitHub hot projects
        id: generate
        env:
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.report_date }}" ]; then
            export REPORT_DATE="${{ github.event.inputs.report_date }}"
          fi
          report_id=$(python3 scripts/generate_github_hot.py)
          echo "report_id=$report_id" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        env:
          REPORT_ID: ${{ steps.generate.outputs.report_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/github-hot; then
            echo "No GitHub hot changes to commit."
            exit 0
          fi

          git add docs/github-hot
          git commit -m "chore(github-hot): update report for $REPORT_ID"
          git push origin HEAD:main
