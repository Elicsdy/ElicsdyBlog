name: Generate daily hot news

on:
  schedule:
    - cron: '0 16 * * *' # 00:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate news page
        id: generate
        env:
          TZ: Asia/Shanghai
        run: |
          REPORT_DATE=$(python3 scripts/generate_hot_news.py)
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs/news; then
            echo "No news changes to commit."
            exit 0
          fi

          git config user.name "伊莱克斯的小龙虾"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news
          git commit -m "chore(news): update daily hot news for ${{ steps.generate.outputs.report_date }}"
          git push
